name: WP Plugin ZIP
on:
  push:
    branches:
      - release
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set Plugin File
        run: |
          VER=$(grep -l ' * Plugin Folder:' *.php . 2>/dev/null | awk '{print $NF}')
          echo "WP_PLUGIN_FILE=$VER" >> $GITHUB_ENV
          echo "WP_PLUGIN_FILE=$VER"
      - name: Set Plugin Version
        run: |
          VER=$(grep -w Version: ${{ env.WP_PLUGIN_FILE }} |grep -v -- -Version|awk '{print $NF}')
          echo "WP_PLUGIN_VERSION=$VER" >> $GITHUB_ENV
      - name: Set Plugin Folder
        run: |
          VER=$(grep -w "Plugin Folder:" ${{ env.WP_PLUGIN_FILE }} |grep -v -- -Folder|awk '{print $NF}')
          echo "WP_PLUGIN_FOLDER=$VER" >> $GITHUB_ENV
      - name: Create Wordpress Plugin Dir for ${{ env.WP_PLUGIN_FOLDER }}/${{ env.WP_PLUGIN_FILE }}
        run: |
          mkdir ${{ env.WP_PLUGIN_FOLDER }}
          mv `ls | grep -v ${{ env.WP_PLUGIN_FOLDER }}` ${{ env.WP_PLUGIN_FOLDER }}/
          mv ${{ env.WP_PLUGIN_FILE }} ${{ env.WP_PLUGIN_FOLDER }}/${{ env.WP_PLUGIN_FILE }}
      - name: Zip Folder
        run: zip -r release-${{ env.WP_PLUGIN_FOLDER }}.zip . -x "*.git/*" "*.github/*" "*.editorconfig" "*_source/*" "*config.codekit3" "*.gitignore" "*phpcs.xml" "*Testing.php" "*test/*" "*docs/*" "*.superpowers/*" "*client.json" "*.DS_Store" "*README.md" "*CHANGELOG.md"
      - name: Cleanup Folders
        run: |
          cd ${{ env.WP_PLUGIN_FOLDER }}
          mv * ../
          cd ../
          rm -rf ${{ env.WP_PLUGIN_FOLDER }}
          echo "Done"
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          # The .git folder is removed in the cleanup step, so name the repo explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          mv release-${{ env.WP_PLUGIN_FOLDER }}.zip release-${{ env.WP_PLUGIN_FOLDER }}-v${{ env.WP_PLUGIN_VERSION }}.zip
          gh release create "v${{ env.WP_PLUGIN_VERSION }}" "release-${{ env.WP_PLUGIN_FOLDER }}-v${{ env.WP_PLUGIN_VERSION }}.zip" --title "Release - v${{ env.WP_PLUGIN_VERSION }}" --target "${{ github.sha }}"
